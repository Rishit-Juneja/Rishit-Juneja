<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Rishit Juneja — cyber security student, IIT Madras minor">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#37ff7e"><animate attributeName="stop-color" values="#37ff7e;#58a6ff;#a371f7;#37ff7e" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#58a6ff"><animate attributeName="stop-color" values="#58a6ff;#a371f7;#37ff7e;#58a6ff" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#a371f7"><animate attributeName="stop-color" values="#a371f7;#37ff7e;#58a6ff;#a371f7" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1c2431" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="240" fill="#0d1117"/>
  <rect width="900" height="240" fill="url(#grid)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- glitch layers -->
  <text x="450" y="130" text-anchor="middle" font-family="monospace" font-size="66" font-weight="bold" fill="#37ff7e" opacity="0.25" filter="url(#glow)">
    <animate attributeName="x" values="450;446;454;450;448;450" dur="5s" repeatCount="indefinite"/>
    RISHIT JUNEJA
  </text>
  <text x="450" y="130" text-anchor="middle" font-family="monospace" font-size="66" font-weight="bold" fill="#a371f7" opacity="0.25" filter="url(#glow)">
    <animate attributeName="x" values="450;455;447;450;452;450" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0;0.25;0.25;0.05;0.25" dur="3s" repeatCount="indefinite"/>
    RISHIT JUNEJA
  </text>
  <text x="450" y="130" text-anchor="middle" font-family="monospace" font-size="66" font-weight="bold" fill="url(#grad)" filter="url(#glow)">
    RISHIT JUNEJA
  </text>

  <text x="450" y="170" text-anchor="middle" font-family="monospace" font-size="20" fill="#8b949e">
    BTech CSE — Cyber Security @ SRMUH · Minor DS-AI @ IIT Madras
  </text>
  <rect x="862" y="155" width="12" height="20" fill="#37ff7e">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.45;0.5;0.95;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- floating particles -->
  <circle cx="80" cy="200" r="2" fill="#37ff7e"><animate attributeName="cy" values="220;40;220" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="200" r="2" fill="#58a6ff"><animate attributeName="cy" values="230;30;230" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="200" r="2" fill="#a371f7"><animate attributeName="cy" values="220;40;220" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="720" cy="200" r="1.5" fill="#37ff7e"><animate attributeName="cy" values="230;30;230" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="120" cy="200" r="1.5" fill="#a371f7"><animate attributeName="cy" values="225;35;225" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" repeatCount="indefinite"/></circle>
</svg>